# One-click backend deploy on Render: dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: cyber-scam-detector-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python train_model.py
    startCommand: gunicorn app:app --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"            # after the frontend is live, replace with its https URL
      - key: ADMIN_TOKEN
        generateValue: true   # needed to press "Retrain" on the Model page
